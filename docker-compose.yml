name: money-tracker

services:
  money-tracker:
    build: .
    container_name: money-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production

x-casaos:
  main: money-tracker
  index: /
  port_map: "3000"
  title:
    en_US: Money Tracker
  tagline:
    en_US: Lightweight personal finance tracker
  description:
    en_US: A lightweight personal finance tracker for managing personal finances.
  icon: ""
  author: you
  developer: you
  category: Finance
  architectures:
    - amd64
    - arm64